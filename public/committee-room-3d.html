<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AIC · Committee Room</title>
<style>
:root{
  --bg:#040810;--bar:#060B16;--line:#122036;--cyan:#4DA3FF;--cyan-dim:#8FB8E8;
  --ink:#EAF1FA;--slate:#7E8CA3;--up:#22C55E;--down:#EF4444;--amber:#F5B84D;
  --body:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* top dock */
.topDock{flex:none;background:rgba(6,11,22,.94);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;padding:11px 20px}
.logo{font-weight:700;font-size:22px;color:var(--cyan);letter-spacing:.5px}
.brandText{font-size:10.5px;letter-spacing:.12em;color:var(--slate);line-height:1.3}
.livePill{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--up);
  border:1px solid rgba(34,197,94,.35);padding:5px 11px;border-radius:999px}
.liveDot{width:6px;height:6px;border-radius:50%;background:var(--up);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.navRight{margin-left:auto;display:flex;align-items:center;gap:9px}
.pillBtn{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);border:1px solid var(--line);
  background:rgba(255,255,255,.03);padding:8px 14px;border-radius:999px;cursor:pointer}
.pillBtn:hover{border-color:var(--cyan)}
select.pillBtn{padding:8px 10px}
.marquee{border-top:1px solid var(--line);overflow:hidden;font-family:var(--mono);font-size:11.5px}
.marqueeTrack{display:flex;gap:40px;white-space:nowrap;width:max-content;padding:6px 0;animation:tickAnim 46s linear infinite}
.marqueeTrack span{color:var(--slate)}
.marqueeTrack b{color:var(--ink);font-weight:500}
.marqueeTrack em{font-style:normal;color:var(--ink)}
.upTxt{color:var(--up)}.downTxt{color:var(--down)}
@keyframes tickAnim{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* stage */
.stage{position:relative;flex:1;min-height:0;background:#02050C}
#gl{position:absolute;inset:0;display:block;transition:filter 1s ease}
#gl.blurred{filter:blur(9px) saturate(.85) brightness(.6)}

.lowerThird{position:absolute;left:20px;bottom:18px;z-index:5;display:flex;flex-direction:column;gap:8px;max-width:min(480px,74%)}
.speakerCard{display:flex;align-items:center;gap:14px;background:rgba(4,8,16,.86);border:1px solid rgba(77,163,255,.35);
  border-left:3px solid var(--cyan);padding:11px 16px}
.speakerName{font-weight:600;font-size:14.5px}
.speakerRole{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--cyan-dim);text-transform:uppercase;margin-top:2px}
.wave{display:flex;align-items:flex-end;gap:2.5px;height:15px;margin-left:auto}
.wave i{width:3px;height:4px;background:var(--cyan)}
.quote{background:rgba(4,8,16,.8);border:1px solid var(--line);padding:10px 14px;font-size:13px;color:#CBD8EA;
  opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;line-height:1.5}
.quote.show{opacity:1;transform:none}

.sessionBar{position:absolute;right:20px;bottom:18px;z-index:5;display:flex;align-items:center;gap:10px;
  background:rgba(4,8,16,.82);border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 16px;
  font-family:var(--mono);font-size:11.5px;color:var(--slate)}
.camBtn{background:none;border:1px solid var(--line);color:var(--slate);border-radius:999px;padding:7px 12px;
  font-family:var(--mono);font-size:10.5px;cursor:pointer}
.camBtn:hover{color:var(--ink);border-color:var(--cyan)}
.floorBtn{background:var(--cyan);color:#04101F;font-weight:600;font-size:12px;border:none;border-radius:999px;
  padding:8px 15px;cursor:pointer;font-family:var(--body)}
.floorBtn:hover{filter:brightness(1.1)}
.floorBtn:disabled{opacity:.5;cursor:default}

/* deck */
.deck{position:absolute;inset:0;z-index:6;padding:16px 20px 92px;display:flex;flex-direction:column;gap:12px;
  pointer-events:none;overflow-y:auto;animation:deckIn .6s ease}
.deck[hidden]{display:none}
@keyframes deckIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.verdictBanner{pointer-events:auto;position:relative;display:flex;align-items:center;gap:24px;flex-wrap:wrap;
  background:rgba(6,12,22,.74);border:1px solid rgba(34,197,94,.4);border-left:4px solid var(--up);padding:12px 18px}
.vbLabel{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--cyan-dim)}
.vbDecision{font-size:30px;font-weight:700;color:var(--up);line-height:1.15}
.vbStats{display:flex;gap:22px;flex-wrap:wrap;margin-left:auto;margin-right:20px}
.vbStats div{display:flex;flex-direction:column;gap:2px}
.vbStats span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--slate);text-transform:uppercase}
.vbStats b{font-family:var(--mono);font-size:16px;color:var(--ink);font-weight:500}
.xBtn{background:none;border:none;color:var(--slate);font-size:15px;cursor:pointer;line-height:1}
.xBtn:hover{color:var(--ink)}
.deckClose{position:absolute;top:7px;right:9px}
.yourDecision{pointer-events:auto;margin:-4px 0 0;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--amber)}
.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
.glass{pointer-events:auto;background:rgba(6,12,22,.66);border:1px solid rgba(77,163,255,.22);padding:13px 15px}
.glass h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--cyan);font-weight:500;
  text-transform:uppercase;padding-bottom:7px;border-bottom:1px solid rgba(77,163,255,.2)}
.glass .src{font-family:var(--mono);font-size:9.5px;color:var(--slate);margin:6px 0 6px}
.glass table{width:100%;border-collapse:collapse;font-size:12px}
.glass td{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
.glass td:first-child{color:var(--slate);padding-right:10px}
.glass td:last-child{text-align:right;font-family:var(--mono);color:var(--ink)}
.glass tr:last-child td{border-bottom:none}
.argFor{color:#B7E4C7!important;text-align:left!important;font-family:var(--body)!important}
.argAgainst{color:#F3C0B6!important;text-align:left!important;font-family:var(--body)!important}
.argDissent{color:#CBD8EA!important;text-align:left!important;font-family:var(--body)!important;line-height:1.45}
.gaps{margin-top:8px;font-size:11.5px;color:var(--amber);line-height:1.5}
.notAdvice{position:absolute;left:20px;bottom:2px;z-index:8;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.06em;color:#5A6478}
.gUp{color:var(--up)!important}.gDown{color:var(--down)!important}.gWarn{color:var(--amber)!important}

/* Q&A */
.qaBar{position:absolute;left:20px;right:20px;bottom:16px;z-index:7;display:flex;gap:9px;
  background:rgba(6,12,22,.86);border:1px solid var(--line);padding:9px}
.qaBar[hidden]{display:none}
.qaBar input{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);padding:10px 13px;font-size:13.5px}
.qaBar input:focus{outline:none;border-color:var(--cyan)}
.qaSend{background:var(--cyan);color:#04101F;font-weight:600;border:none;padding:10px 20px;font-size:13px;cursor:pointer}
.qaSend:hover{filter:brightness(1.1)}
.qaSend:disabled{opacity:.5;cursor:default}

/* bottom dock */
.bottomDock{flex:none;background:var(--bar);border-top:1px solid var(--line)}
.tickerHead{display:flex;align-items:center;padding:6px 20px 0;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--slate)}
.editBtn{background:none;border:1px solid var(--line);color:var(--slate);font-family:var(--mono);font-size:9.5px;
  letter-spacing:.1em;padding:3px 9px;border-radius:999px;cursor:pointer;margin-left:12px}
.editBtn:hover{color:var(--cyan);border-color:var(--cyan)}
.headSpacer{flex:1}
.tickerRow{display:flex;gap:1px;background:var(--line);border-top:1px solid var(--line);margin-top:6px;overflow-x:auto;scrollbar-width:none}
.tickerRow::-webkit-scrollbar{display:none}
.tick{flex:1;min-width:122px;background:var(--bar);padding:8px 12px;font-family:var(--mono)}
.tick .sym{font-size:11px;color:var(--cyan-dim)}
.tick .px{font-size:13px;color:var(--ink);margin-top:2px}
.tick .chg{font-size:10px;margin-top:1px}
.chgUp{color:var(--up)}.chgDown{color:var(--down)}
.flashUp{animation:flU 1s ease-out}.flashDown{animation:flD 1s ease-out}
@keyframes flU{0%{color:#22C55E;text-shadow:0 0 12px rgba(34,197,94,.7)}100%{color:var(--ink)}}
@keyframes flD{0%{color:#EF4444;text-shadow:0 0 12px rgba(239,68,68,.7)}100%{color:var(--ink)}}
.newsRow{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding:7px 20px;font-size:12px;overflow:hidden}
.newsLabel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--amber);white-space:nowrap;background:var(--bar);padding-right:12px;z-index:2}
.newsViewport{flex:1;overflow:hidden;min-width:0}
.newsTrack{display:flex;gap:40px;white-space:nowrap;width:max-content;animation:tickAnim 40s linear infinite;color:var(--cyan-dim)}
.newsTrack time{font-family:var(--mono);color:var(--slate);margin-right:7px;font-size:10.5px}

/* modal */
.modalWrap{position:fixed;inset:0;z-index:80;background:rgba(2,5,12,.72);display:grid;place-items:center;padding:20px}
.modalWrap[hidden]{display:none}
.modal{width:min(520px,100%);background:var(--bar);border:1px solid var(--line)}
.modalHead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--cyan-dim);text-transform:uppercase}
.modalBody{padding:16px 18px}
.modalHint{font-size:12.5px;color:var(--slate);margin-bottom:12px}
.symGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px;max-height:240px;overflow-y:auto}
.symChip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.02);
  padding:8px 10px;cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--slate);user-select:none}
.symChip.on{color:var(--ink);border-color:rgba(77,163,255,.5);background:rgba(77,163,255,.08)}
.symBox{width:13px;height:13px;border:1px solid var(--slate);display:grid;place-items:center;font-size:9px;color:#04101F;flex:none}
.symChip.on .symBox{background:var(--cyan);border-color:var(--cyan)}
.symDrop{margin-left:auto;color:var(--slate)}
.symDrop:hover{color:var(--down)}
.addRow{display:flex;gap:8px;margin-top:14px}
.addRow input{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--ink);
  padding:9px 11px;font-family:var(--mono);font-size:12.5px;text-transform:uppercase}
.addRow input:focus{outline:none;border-color:var(--cyan)}
.addBtn{background:rgba(77,163,255,.12);border:1px solid rgba(77,163,255,.45);color:var(--cyan);padding:9px 16px;font-size:12.5px;cursor:pointer}
.modalErr{margin-top:9px;font-size:11.5px;color:var(--down)}
.modalFoot{display:flex;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line)}
.resetBtn{background:none;border:1px solid var(--line);color:var(--slate);padding:8px 15px;font-size:12.5px;cursor:pointer}
.doneBtn{background:var(--cyan);color:#04101F;font-weight:600;border:none;padding:8px 20px;font-size:12.5px;cursor:pointer}

.note{position:absolute;left:50%;transform:translateX(-50%);top:12px;z-index:9;background:rgba(6,12,22,.94);
  border:1px solid var(--amber);color:var(--amber);font-size:12px;padding:8px 15px;max-width:min(560px,90%);text-align:center}
.note.err{border-color:var(--down);color:var(--down)}

@media(max-width:900px){
  .brandText{display:none}
  .panels{grid-template-columns:1fr}
  .glass:nth-child(3){display:none}
  .deck{padding:12px 12px 86px}
  .qaBar{left:12px;right:12px}
  .sessionBar{display:none}
  .lowerThird{left:12px;bottom:12px;max-width:88%}
}
@media(prefers-reduced-motion:reduce){.marqueeTrack,.newsTrack,.liveDot{animation:none}}
</style>
</head>
<body>
<div class="topDock">
  <nav class="nav">
    <span class="logo">AIC</span>
    <span class="brandText">AI INVESTMENT<br>COMMITTEE</span>
    <span class="livePill"><span class="liveDot"></span><span id="liveTxt">LIVE</span></span>
    <div class="navRight">
      <button class="pillBtn" id="voiceBtn">Voice off</button>
      <select class="pillBtn" id="langSel" aria-label="Language">
        <option value="en">EN</option><option value="ru">RU</option><option value="es">ES</option>
        <option value="fr">FR</option><option value="de">DE</option><option value="it">IT</option>
        <option value="pt">PT</option><option value="tr">TR</option><option value="az">AZ</option><option value="ar">AR</option>
      </select>
    </div>
  </nav>
  <div class="marquee" aria-hidden="true"><div class="marqueeTrack" id="mTrack"></div></div>
</div>

<div class="stage" id="stage">
  <canvas id="gl"></canvas>
  <div class="lowerThird">
    <div class="speakerCard">
      <div><div class="speakerName" id="spkName">—</div><div class="speakerRole" id="spkRole">—</div></div>
      <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="quote" id="quote"></div>
  </div>
  <div class="sessionBar">
    <span id="timer">00:00</span>
    <button class="camBtn" id="camToggle">CAM: AUTO</button>
    <button class="floorBtn" id="floorBtn">Request the floor</button>
  </div>
  <div class="deck" id="deck" hidden>
    <div class="verdictBanner">
      <div><div class="vbLabel" id="vbLabel">COMMITTEE DECISION</div><div class="vbDecision" id="vbDecision">—</div></div>
      <div class="vbStats">
        <div><span id="vbConfL">Confidence</span><b id="vbConf">—</b></div>
        <div><span id="vbAmtL">Amount</span><b id="vbAmt">—</b></div>
        <div><span id="vbAllocL">Allocation</span><b id="vbAlloc">—</b></div>
        <div><span id="vbVoteL">Votes</span><b id="vbVotes">—</b></div>
      </div>
      <button class="xBtn deckClose" id="deckClose" aria-label="Hide">✕</button>
    </div>
    <p class="yourDecision" id="yourDecision"></p>
    <div class="panels">
      <section class="glass" id="panelVotes"></section>
      <section class="glass" id="panelRisk"></section>
      <section class="glass" id="panelMarket"></section>
    </div>
  </div>
  <div class="notAdvice" id="notAdvice"></div>
  <div class="qaBar" id="qaBar" hidden>
    <input id="qaInput" autocomplete="off" maxlength="400" placeholder="Ask the committee…" />
    <button class="qaSend" id="qaSend">Ask</button>
    <button class="camBtn" id="newSession">New session</button>
  </div>
</div>

<div class="bottomDock">
  <div class="tickerHead">
    <span id="tickerLabel">LIVE MARKET TICKER · FINNHUB</span>
    <button class="editBtn" id="editTicks">✎ <span id="editTxt">Edit</span></button>
    <span class="headSpacer"></span><span id="clock">—</span>
  </div>
  <div class="tickerRow" id="tickRow"></div>
  <div class="newsRow">
    <span class="newsLabel" id="newsLabel">SESSION</span>
    <div class="newsViewport"><div class="newsTrack" id="newsTrack"></div></div>
  </div>
</div>

<div class="modalWrap" id="tickModal" hidden>
  <div class="modal">
    <div class="modalHead"><span id="mTitle">Market ticker</span><button class="xBtn" id="closeTicks">✕</button></div>
    <div class="modalBody">
      <p class="modalHint" id="mHint">Choose which instruments appear in the ticker.</p>
      <div class="symGrid" id="symGrid"></div>
      <div class="addRow"><input id="symInput" placeholder="AMD, IBM…" maxlength="12" /><button class="addBtn" id="addSym">Add</button></div>
      <p class="modalErr" id="symErr" hidden></p>
    </div>
    <div class="modalFoot"><button class="resetBtn" id="resetTicks">Reset</button><button class="doneBtn" id="doneTicks">Done</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

const qs = new URLSearchParams(location.search);

      askPh:'Ask the committee…',newSession:'New session',ticker:'LIVE MARKET TICKER · FINNHUB',session:'SESSION',

      pVotes:'Committee votes',pRisk:'Key risks',pMarket:'Market data',member:'Member',vote:'Vote',
      opening:'Opening the session',connecting:'Convening the committee…',you:'You',question:'Client question',
      summaryNote:'The decision is on the record. The floor is open for your questions.',

      add:'Add',reset:'Reset',done:'Done',errMin:'Keep at least 3 instruments.',errMax:'Maximum 14 instruments.',

  g.fillStyle='#8FB8E8'; g.font='400 '+(role.length>24?22:28)+'px sans-serif'; g.fillText(role,256,104);
  if (vote){ g.fillStyle=voteColor(vote); g.font='600 26px monospace'; g.fillText(String(vote).replace('_',' ').toUpperCase(),256,144); }
}
function makePlate(m){
  const c=document.createElement('canvas'); c.width=512; c.height=168;

}

/* load a GLB avatar into a seat, replacing the stylised figure */
const gltfLoader = (typeof THREE.GLTFLoader === 'function') ? new THREE.GLTFLoader() : null;

function attachAvatar(seatIndex, url){
  if (!gltfLoader || !url) return;
  gltfLoader.load(url, (gltf) => {
    const model = gltf.scene;
    const o = people[seatIndex];

    /* scale so the seated character matches the table height */
    const box = new THREE.Box3().setFromObject(model);
    const height = box.max.y - box.min.y;
    const targetHeight = 1.75;                       /* metres, standing */
    if (height > 0.1) model.scale.setScalar(targetHeight / height);

    model.traverse((n) => {
      if (n.isMesh){ n.castShadow = true; n.frustumCulled = false; }
      /* head bone drives eye contact; morph targets drive the mouth */
      const name = (n.name || '').toLowerCase();
      if (!o.headBone && (name === 'head' || name.endsWith('head'))) o.headBone = n;
      if (n.morphTargetDictionary){
        const dict = n.morphTargetDictionary;
        const key = ['mouthOpen','viseme_aa','jawOpen','mouth_open','A'].find(k => k in dict);
        if (key !== undefined){ o.mouthMesh = n; o.mouthIndex = dict[key]; }
      }
    });

    /* seat the character: hide the procedural body, keep the chair and floor ring */
    o.group.traverse((n) => { if (n.isMesh && n !== o.ring && !o.keep.includes(n)) n.visible = false; });
    model.position.y = 0.02;
    model.rotation.y = Math.PI;                       /* GLB avatars face -Z by default */
    o.avatarRoot = model;
    o.group.add(model);
    o.hasAvatar = true;
  }, undefined, (err) => {
    console.warn('Avatar failed for seat ' + seatIndex + ', keeping the built-in figure', err);
  });
}

MEMBERS.forEach((m, i) => { if (AVATAR_URLS[m.id]) attachAvatar(i, AVATAR_URLS[m.id]); });

const WIDE_POS = new THREE.Vector3(0,3.3,8.8), WIDE_TGT = new THREE.Vector3(0,2.1,-1.2);
let camPos = WIDE_POS.clone(), camTgt = WIDE_TGT.clone();
let goalPos = WIDE_POS.clone(), goalTgt = WIDE_TGT.clone(), lerpF = .02;
let activeIdx = -1, autoCam = true, shotCount = 0;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function cutTo(start, end, tgt, speed){
  camPos.copy(start); goalPos.copy(end); camTgt.copy(tgt); goalTgt.copy(tgt);
  lerpF = reduced ? 0 : speed;
}
function wideShot(hard){
  activeIdx = -1;
  people.forEach(p => p.ringGoal = 0);
  if (hard) cutTo(new THREE.Vector3(0,3.35,9.8), WIDE_POS, WIDE_TGT, .012);
  else { goalPos.copy(WIDE_POS); goalTgt.copy(WIDE_TGT); lerpF = .03; }
}
function screenShot(){
  activeIdx = -1; people.forEach(p => p.ringGoal = 0);
  cutTo(new THREE.Vector3(0,3.2,3.4), new THREE.Vector3(0,3.3,2.5), new THREE.Vector3(0,3.55,-5.2), .009);
}
function closeUp(i){
  if (!autoCam) return;
  const p = people[i].group.position;
  /* frame the head AND shoulders, not just the face — aim slightly below eye level */
  const hp = new THREE.Vector3(p.x, 1.70, p.z);
  const f = new THREE.Vector3(-.6*p.x, 0, 7-p.z).normalize();
  shotCount++;
  const kind = shotCount % 3;
  /* medium shot · closer medium · slight low angle. Never tighter than this:
     a face filling the frame reads as a glitch, not as direction. */
  let d0 = 4.6, d1 = 3.8, hy = 2.10;
  if (kind === 1){ d0 = 4.0; d1 = 3.3; hy = 2.02; }
  if (kind === 2){ d0 = 4.7; d1 = 4.0; hy = 1.80; }
  const start = hp.clone().add(f.clone().multiplyScalar(d0)); start.y = hy;
  const end   = hp.clone().add(f.clone().multiplyScalar(d1)); end.y = hy + .04;
  cutTo(start, end, hp, .008);
}
document.getElementById('camToggle').addEventListener('click', e=>{
  autoCam = !autoCam;
  e.target.textContent = autoCam ? 'CAM: AUTO' : 'CAM: WIDE';
  if (!autoCam) wideShot(false); else if (activeIdx >= 0) closeUp(activeIdx);
});

   ============================================================ */
let voiceOn = false, audioCtx = null, analyser = null, srcNode = null, ampData = null;
let amplitude = 0, voiceSeq = 0;
const voiceCache = new Map();

async function unlockAudio(){
  try{
    if (!audioCtx){
      const C = window.AudioContext || window.webkitAudioContext;
      audioCtx = new C();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = .75;
      analyser.connect(audioCtx.destination);
      ampData = new Uint8Array(analyser.frequencyBinCount);
    }
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    return true;
  } catch(e){ return false; }
}
function stopVoice(){
  voiceSeq++;
  if (srcNode){ try{ srcNode.onended = null; srcNode.stop(); }catch(e){} srcNode = null; }
  people.forEach(p => p.talking = false);
  amplitude = 0;
}
async function speak(memberIdx, text){
  if (!voiceOn || !audioCtx || !text) return;
  const m = MEMBERS[memberIdx];
  const token = ++voiceSeq;
  if (srcNode){ try{ srcNode.onended = null; srcNode.stop(); }catch(e){} srcNode = null; }
  people.forEach(p => p.talking = false);

  const cacheKey = m.id + '|' + lang + '|' + text;
  let buf = voiceCache.get(cacheKey);
  if (!buf){
    try{
      const r = await fetch('/api/voice', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ text, language: lang, member: m.id })
      });
      if (!r.ok) throw new Error('voice ' + r.status);
      buf = await audioCtx.decodeAudioData(await r.arrayBuffer());
      if (voiceCache.size > 50) voiceCache.delete(voiceCache.keys().next().value);
      voiceCache.set(cacheKey, buf);
    } catch(err){
      console.error('Voice failed', err);
      note(t().errVoice, true);
      return;
    }
  }
  if (token !== voiceSeq) return;
  const s = audioCtx.createBufferSource();
  s.buffer = buf; s.connect(analyser);
  s.onended = () => { if (srcNode === s){ srcNode = null; people.forEach(p=>p.talking=false); amplitude = 0; } };
  srcNode = s; people[memberIdx].talking = true;
  s.start();
}

function runDebate(){
  const opinions = Array.isArray(session.opinions) ? session.opinions : [];
  const md = market || {};
  const script = [];

  script.push({ seat: CHAIR, text: t().chairOpen + ' ' + (session.summary || '') });

  /* the four voting specialists — straight from the API */
  opinions.forEach(op => {
    const i = byApi(op.memberId);
    if (i < 0) return;
    MEMBERS[i].role = op.title || MEMBERS[i].role;
    MEMBERS[i].vote = op.vote;
    people[i].plate.userData.repaint();
    script.push({ seat:i, text:op.thesis, vote:op.vote, confidence:op.confidence, risks:op.risks || [] });
  });

  /* the two analyst seats present figures from the same payload — no invented opinions */
  const quant = byId('quant'), macro = byId('macro');
  const numbers = [];
  if (md.peTTM != null)  numbers.push('P/E ' + Number(md.peTTM).toFixed(1));
  if (md.epsTTM != null) numbers.push('EPS ' + Number(md.epsTTM).toFixed(2));
  if (md.beta != null)   numbers.push('beta ' + Number(md.beta).toFixed(2));
  if (md.fiftyTwoWeekLow != null && md.fiftyTwoWeekHigh != null)
    numbers.push('52W ' + Number(md.fiftyTwoWeekLow).toFixed(0) + '–' + Number(md.fiftyTwoWeekHigh).toFixed(0));
  if (numbers.length) script.splice(3, 0, { seat:quant, text: t().readsFigures + ' ' + numbers.join(' · ') + '.' });

  const trigger = (session.reviewTriggers || [])[0] || (session.risks || [])[0];
  if (trigger) script.push({ seat:macro, text: trigger });

  script.push({ seat: CHAIR, text: t().chairClose });

  MEMBERS[CHAIR].vote = session.decision;
  people[CHAIR].plate.userData.repaint();

  let step = 0;
  const advance = () => {
    if (sessionState !== 'debate') return;
    if (step >= script.length){ showVerdict(); return; }
    const s2 = script[step++];
    const m = MEMBERS[s2.seat];
    showLine(s2.seat, m.name, m.role, s2.text);
    if (s2.vote){
      minutes.push({ name:m.name, role:m.role, vote:s2.vote, confidence:s2.confidence, thesis:s2.text, risks:s2.risks });
      drawScreen();
    }
    history.push({ role: m.role, text: s2.text });
    later(advance, Math.min(9000, 4200 + (s2.text || '').length * 30));
  };
  advance();
}

function demoAnswer(q){
  const s = q.toLowerCase();
  const pick = /risk|риск|drawdown|просад|упад|fall|riesgo/.test(s) ? 'risk'
    : /valuation|оценк|дорог|p\/e|переоцен/.test(s) ? 'fundamental'
    : /how much|сколько|allocat|размер|portfolio|портфел/.test(s) ? 'portfolio'
    : /market|рынок|momentum|цена|price/.test(s) ? 'market' : 'chairman';
  const lines = {
    risk:'Concentration is the binding constraint. Even a sharp drawdown stays inside mandate at this size.',
    fundamental:'The premium is real, but earnings growth still outpaces the multiple.',
    portfolio:'A staged entry keeps the position inside the allocation band.',
    market:'Momentum is intact; the entry point is extended, which is why we are staging it.',
    chairman:'The committee stands by the recorded decision. This is demo data — connect the API for a real answer.'
  };
  return { turns:[
      {member:'chairman', role:'Committee Chair', kind:'statement', text:'Noted. Let the responsible member answer.'},
      {member:pick, role:pick, kind:'statement', text:lines[pick]}
    ], decisionChanged:false, updatedDecision:session.decision,
    updatedConfidence:session.confidence, updatedAllocation:session.proposedPortfolioAllocationPercent };
}

const qaInput = document.getElementById('qaInput');
const qaSend  = document.getElementById('qaSend');
let asking = false;

async function askCommittee(){
  const q = qaInput.value.trim();
  if (!q || asking || sessionState !== 'qa' || !session) return;
  asking = true; qaSend.disabled = true;
  clearTimers(); stopVoice();

  activeIdx = -1; people.forEach(p=>p.ringGoal=0);
  spkName.textContent = t().you;
  spkRole.textContent = t().question;
  quoteEl.classList.remove('show');
  later(()=>{ quoteEl.textContent = '«'+q+'»'; quoteEl.classList.add('show'); }, 150);
  qaInput.value = '';
  setBlur(false);

  let data;
  try{
    const r = await fetch('/api/committee/follow-up', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        question: q, language: lang,
        proposal: PROPOSAL,
        recommendation: session,
        history: history.slice(-12)
      })
    });
    if (!r.ok) throw new Error('follow-up ' + r.status);
    data = await r.json();
  } catch(err){
    console.warn('Follow-up API unreachable — demo answer', err);
    demoMode = true;
    data = demoAnswer(q);
    note('DEMO — ' + t().errAsk);
  }

  history.push({ role:'client', text:q });
  const turns = Array.isArray(data.turns) ? data.turns : [];
  let k = 0;
  const playTurn = () => {
    if (sessionState !== 'qa') return;
    if (k >= turns.length){
      if (data.decisionChanged){
        session.decision = data.updatedDecision || session.decision;
        session.confidence = typeof data.updatedConfidence === 'number' ? data.updatedConfidence : session.confidence;
        session.proposedPortfolioAllocationPercent =
          typeof data.updatedAllocation === 'number' ? data.updatedAllocation : session.proposedPortfolioAllocationPercent;
        buildDeck(); drawScreen();
      }
      asking = false; qaSend.disabled = false;
      activeIdx = -1; people.forEach(p=>p.ringGoal=0);
      cutTo(new THREE.Vector3(0,3.25,6.2), new THREE.Vector3(0,3.25,5.4), new THREE.Vector3(0,2.6,-2.6), .004);
      setBlur(true);
      return;
    }
    const turn = turns[k++];
    const i = byApi(turn.member);
    if (i < 0){ playTurn(); return; }
    showLine(i, MEMBERS[i].name, turn.role || MEMBERS[i].role, turn.text);
    history.push({ role: turn.role || turn.member, text: turn.text });
    later(playTurn, Math.min(11000, 3200 + (turn.text || '').length * 42));
  };
  playTurn();
}

function fit(ctx, s, maxW){
  if (ctx.measureText(s).width <= maxW) return s;
  let out = s;
  while (out.length > 4 && ctx.measureText(out+'…').width > maxW) out = out.slice(0,-1);
  return out + '…';
}
function gridBg(){
  scr.fillStyle='#040A14'; scr.fillRect(0,0,1600,560);
  scr.strokeStyle='#12233C'; scr.lineWidth=2;
  for(let x=0;x<=1600;x+=100){scr.beginPath();scr.moveTo(x,0);scr.lineTo(x,560);scr.stroke();}
  for(let y=0;y<=560;y+=70){scr.beginPath();scr.moveTo(0,y);scr.lineTo(1600,y);scr.stroke();}
}
function drawScreen(){
  const L = t(); gridBg(); scr.textAlign='left';
  const md = market || {};
  scr.fillStyle='#8FB8E8'; scr.font='600 32px sans-serif';
  scr.fillText((md.name || PROPOSAL.ticker) + ' · ' + PROPOSAL.ticker, 48, 58);
  scr.fillStyle='#EAF1FA'; scr.font='600 66px monospace';
  scr.fillText(md.currentPrice != null ? (md.currency||'$')+' '+Number(md.currentPrice).toFixed(2) : '—', 48, 138);
  const up = (md.changePercent||0) >= 0;
  scr.fillStyle = up ? '#22C55E' : '#EF4444'; scr.font='500 28px monospace';
  scr.fillText((up?'▲ ':'▼ ') + Math.abs(md.changePercent||0).toFixed(2) + '%  ·  FINNHUB', 48, 182);

  if (sessionState === 'qa' && session){
    scr.fillStyle='#8FB8E8'; scr.font='600 26px sans-serif';
    scr.fillText(L.pVotes.toUpperCase(), 48, 246);
    scr.strokeStyle='#1E3A5F'; scr.beginPath(); scr.moveTo(48,262); scr.lineTo(940,262); scr.stroke();
    minutes.forEach((r,i)=>{
      const y = 306 + i*54;
      scr.fillStyle='#EAF1FA'; scr.font='500 26px sans-serif';
      scr.fillText(fit(scr, r.name+' · '+r.role, 620), 48, y);
      scr.fillStyle=voteColor(r.vote); scr.font='600 24px monospace';
      scr.textAlign='right'; scr.fillText(String(r.vote).replace('_',' ').toUpperCase(), 940, y); scr.textAlign='left';
      scr.strokeStyle='#0F1B2E'; scr.beginPath(); scr.moveTo(48,y+16); scr.lineTo(940,y+16); scr.stroke();
    });
    scr.fillStyle='#8FB8E8'; scr.font='600 28px sans-serif';
    scr.fillText(L.decision, 1010, 82);
    scr.fillStyle=voteColor(session.decision); scr.font='700 76px sans-serif';
    scr.fillText(String(session.decision||'').replace('_',' ').toUpperCase(), 1010, 168);
    scr.fillStyle='#EAF1FA'; scr.font='500 30px monospace';
    scr.fillText(L.conf+' '+pct((session.confidence||0)*100), 1010, 232);
    scr.fillText(L.amount+' '+money(session.proposedInvestmentAmount), 1010, 282);
    scr.fillText(L.alloc+' '+(Number(session.proposedPortfolioAllocationPercent)||0).toFixed(1)+'%', 1010, 332);
    scr.fillStyle='#7E8CA3'; scr.font='400 24px sans-serif';
    (session.reasons||[]).slice(0,3).forEach((r,i)=> scr.fillText(fit(scr,'• '+r,540), 1010, 396+i*40));
  } else {
    scr.fillStyle='#54607A'; scr.font='400 28px sans-serif';
    scr.fillText(L.connecting, 48, 250);
    minutes.forEach((r,i)=>{
      const y = 306 + i*54;
      scr.fillStyle='#EAF1FA'; scr.font='500 26px sans-serif';
      scr.fillText(fit(scr, r.name+' · '+r.role, 620), 48, y);
      scr.fillStyle=voteColor(r.vote); scr.font='600 24px monospace';
      scr.textAlign='right'; scr.fillText(String(r.vote).replace('_',' ').toUpperCase(), 940, y); scr.textAlign='left';
    });
  }
  scrTex.needsUpdate = true;
}

/* ============================================================
   Render loop
   ============================================================ */
function resize(){
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
resize(); addEventListener('resize', resize);

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const tt = clock.getElapsedTime();

  if (analyser && srcNode){
    analyser.getByteTimeDomainData(ampData);
    let peak = 0;
    for (let i=0;i<ampData.length;i++){ const v = Math.abs(ampData[i]-128)/128; if (v>peak) peak = v; }
    amplitude += (Math.min(1, peak*2.2) - amplitude) * .35;
  } else amplitude += (0 - amplitude) * .2;

  people.forEach((o,i)=>{
    const speaking = i === activeIdx;
    o.group.position.y = Math.sin(tt*1.1 + o.phase) * .012;
    o.group.rotation.y = o.baseRotY + Math.sin(tt*.45 + o.phase) * .04;
    const amp = speaking
      ? (o.talking ? amplitude : (voiceOn ? 0 : Math.abs(Math.sin(tt*9))*.45))
      : 0;

    /* real avatars: head bone for eye contact, morph target for the mouth */
    if (o.hasAvatar){
      if (o.mouthMesh && o.mouthIndex !== undefined){
        const infl = o.mouthMesh.morphTargetInfluences;
        infl[o.mouthIndex] += ((speaking ? Math.min(1, amp * 1.3) : 0) - infl[o.mouthIndex]) * .35;
      }
      if (o.headBone){
        if (speaking){
          const q0 = o.headBone.quaternion.clone();
          o.headBone.lookAt(camera.position);
          const q1 = o.headBone.quaternion.clone();
          o.headBone.quaternion.copy(q0).slerp(q1, .10);
        } else {
          o.headBone.quaternion.slerp(new THREE.Quaternion(), .05);
        }
      }
    }

    if (speaking){
      const q0 = o.headG.quaternion.clone();
      o.headG.lookAt(camera.position);
      const q1 = o.headG.quaternion.clone();
      o.headG.quaternion.copy(q0).slerp(q1, .16);
      o.headG.rotation.x += Math.sin(tt*7.5)*.02;
      o.mouth.scale.y += (.28 + amp*1.6 - o.mouth.scale.y) * .35;
      o.mouth.scale.z = .5 + amp*.25;
    } else {
      let lookX = 0;
      if (activeIdx >= 0){
        const sp = people[activeIdx].group.position;
        lookX = THREE.MathUtils.clamp(Math.atan2(sp.x - o.group.position.x, sp.z - o.group.position.z + 6)*.55, -.5, .5);
      }
      o.headG.rotation.z *= .9;
      o.headG.rotation.y += (lookX - o.headG.rotation.y)*.06;
      o.headG.rotation.x += (Math.sin(tt*.7+o.phase)*.03 - o.headG.rotation.x)*.08;
      o.mouth.scale.y += (.28 - o.mouth.scale.y)*.2;
    }
    const cur = o.ring.material.opacity;
    o.ring.material.opacity = cur + ((o.ringGoal||0) + (speaking?Math.sin(tt*4)*.12:0) - cur)*.08;
  });

  puckRing.material.opacity = .5 + Math.sin(tt*2)*.3;
  document.querySelectorAll('#wave i').forEach((el,i)=>{
    const a = activeIdx >= 0 ? (amplitude || (voiceOn?0:Math.abs(Math.sin(tt*8+i))*.5)) : 0;
    el.style.height = (4 + a*11 * (1 - Math.abs(i-2)*.15)) + 'px';
  });

  if (lerpF > 0){ camPos.lerp(goalPos, lerpF); camTgt.lerp(goalTgt, lerpF); }
  camera.position.copy(camPos);
  if (!reduced){ camera.position.x += Math.sin(tt*.5)*.04; camera.position.y += Math.sin(tt*.8)*.025; }
  camera.lookAt(camTgt);
  renderer.render(scene, camera);
}
animate();

/* ============================================================
   Market ticker — live from /api/market-data, user-editable
   ============================================================ */
const DEFAULT_SYMS = ['SPY','QQQ','DIA','NVDA','AAPL','MSFT','AMZN','GOOGL','META','TSLA'];
const CATALOG = ['SPY','QQQ','DIA','IWM','GLD','TLT','NVDA','AAPL','MSFT','AMZN','GOOGL','META','TSLA','AMD','AVGO','NFLX','JPM','V','XOM','COIN','PLTR','UBER','BINANCE:BTCUSDT','BINANCE:ETHUSDT','OANDA:EUR_USD'];
let symbols = DEFAULT_SYMS.slice();
try { const s = JSON.parse(localStorage.getItem('aic-symbols')||'null'); if (Array.isArray(s) && s.length) symbols = s; } catch(e){}
const saveSyms = () => { try{ localStorage.setItem('aic-symbols', JSON.stringify(symbols)); }catch(e){} };

const quotes = {};
const tickRow = document.getElementById('tickRow');
const mTrack  = document.getElementById('mTrack');

function renderTickerShell(){
  tickRow.innerHTML = symbols.map((s,i)=>
    '<div class="tick"><div class="sym">'+s+'</div><div class="px" id="px'+i+'">—</div><div class="chg" id="ch'+i+'">—</div></div>').join('');
  const span = symbols.map((s,i)=>'<span><b>'+s+'</b> <em class="mp'+i+'">—</em> <i class="mc'+i+'"></i></span>').join('');
  mTrack.innerHTML = span + span;
  paintTicker();
}
function paintTicker(){
  symbols.forEach((s,i)=>{
    const q = quotes[s];
    const pxEl = document.getElementById('px'+i), chEl = document.getElementById('ch'+i);
    if (!pxEl) return;
    if (!q || !Number.isFinite(Number(q.currentPrice))){
      pxEl.textContent = '—'; pxEl.classList.remove('flashUp','flashDown');
      chEl.textContent = t().noQuote; chEl.className = 'chg';
      document.querySelectorAll('.mp'+i).forEach(e=> e.textContent = '—');
      document.querySelectorAll('.mc'+i).forEach(e=>{ e.textContent = ''; e.className = 'mc'+i; });
      return;
    }
    const up = (q.changePercent||0) >= 0;
    const pxTxt = Number(q.currentPrice).toFixed(2);
    const chTxt = (up?'▲ ':'▼ ') + Math.abs(q.changePercent||0).toFixed(2) + '%';
    if (pxEl.textContent !== '—' && pxEl.textContent !== pxTxt){
      pxEl.classList.remove('flashUp','flashDown'); void pxEl.offsetWidth;
      pxEl.classList.add(Number(pxTxt) >= Number(pxEl.textContent) ? 'flashUp' : 'flashDown');
    }
    pxEl.textContent = pxTxt;
    chEl.textContent = chTxt;
    chEl.className = 'chg ' + (up?'chgUp':'chgDown');
    document.querySelectorAll('.mp'+i).forEach(e=> e.textContent = pxTxt);
    document.querySelectorAll('.mc'+i).forEach(e=>{ e.textContent = chTxt.replace(' ',''); e.className='mc'+i+' '+(up?'upTxt':'downTxt'); });
  });
}
async function refreshQuotes(){
  let ok = false;
  for (const s of symbols){
    try{
      const r = await fetch('/api/market-data?symbol=' + encodeURIComponent(s));
      if (!r.ok) throw new Error(String(r.status));
      quotes[s] = await r.json(); ok = true;
      if (s === PROPOSAL.ticker){ market = quotes[s]; drawScreen(); }
    } catch(e){
      /* NEVER fabricate a price. An empty cell is honest; a plausible
         number that is actually invented is not. */
      quotes[s] = null;
    }
  }
  liveState(ok);
  paintTicker();
}

/* make the absence of live data impossible to mistake for live data */
function liveState(ok){
  const label = document.getElementById('tickerLabel');
  const pill  = document.querySelector('.livePill');
  if (ok){
    label.textContent = t().ticker;
    label.style.color = '';
    if (pill) pill.style.display = '';
    const b = document.getElementById('demoBadge'); if (b) b.remove();
    return;
  }
  label.textContent = t().noLive;
  label.style.color = 'var(--amber)';
  if (pill) pill.style.display = 'none';      /* do not claim LIVE when it is not */
  modeBadge(t().noLiveBadge);
}

function demoBadge(){ modeBadge('DEMO DATA'); }
function modeBadge(label){
  let b = document.getElementById('demoBadge');
  if (b){ b.textContent = label; return; }
  b = document.createElement('span');
  b.id = 'demoBadge';
  b.textContent = label;
  b.style.cssText = 'margin-left:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;'+
    'color:var(--amber);border:1px solid var(--amber);padding:3px 8px;border-radius:999px';
  document.querySelector('.livePill').after(b);
}
renderTickerShell();
refreshQuotes();
setInterval(refreshQuotes, 15000);   /* quotes must stay live */

/* ticker editor */
const modal = document.getElementById('tickModal');
const symGrid = document.getElementById('symGrid');
const symErr = document.getElementById('symErr');
const showErr = m => { symErr.textContent = m; symErr.hidden = false; };
function renderGrid(){
  const all = Array.from(new Set([...CATALOG, ...symbols]));
  symGrid.innerHTML = all.map(s=>{
    const on = symbols.includes(s), custom = !CATALOG.includes(s);
    return '<div class="symChip '+(on?'on':'')+'" data-sym="'+s+'"><span class="symBox">'+(on?'✓':'')+'</span><span>'+s+'</span>'+
      (custom?'<span class="symDrop" data-del="'+s+'">✕</span>':'')+'</div>';
  }).join('');
}
symGrid.addEventListener('click', e=>{
  const del = e.target.closest('[data-del]');
  if (del){ symbols = symbols.filter(x=>x!==del.dataset.del); saveSyms(); renderGrid(); renderTickerShell(); refreshQuotes(); return; }
  const chip = e.target.closest('.symChip'); if (!chip) return;
  const s = chip.dataset.sym;
  if (symbols.includes(s)){
    if (symbols.length <= 3) return showErr(t().errMin);
    symbols = symbols.filter(x=>x!==s);
  } else {
    if (symbols.length >= 14) return showErr(t().errMax);
    symbols.push(s);
  }
  symErr.hidden = true; saveSyms(); renderGrid(); renderTickerShell(); refreshQuotes();
});
async function addSymbol(){
  const input = document.getElementById('symInput');
  const s = input.value.trim().toUpperCase().replace(/\s+/g,'');
  if (!s) return;
  if (symbols.includes(s)) return showErr(t().errDup);
  if (symbols.length >= 14) return showErr(t().errMax);
  try{
    const r = await fetch('/api/market-data?symbol=' + encodeURIComponent(s));
    if (!r.ok) throw new Error('bad symbol');
    quotes[s] = await r.json();
  } catch(e){ return showErr('“'+s+'” — ?'); }
  symbols.push(s); input.value=''; symErr.hidden = true;
  saveSyms(); renderGrid(); renderTickerShell();
}
document.getElementById('addSym').addEventListener('click', addSymbol);
document.getElementById('symInput').addEventListener('keydown', e=>{ if (e.key==='Enter') addSymbol(); });
document.getElementById('editTicks').addEventListener('click', ()=>{ renderGrid(); symErr.hidden=true; modal.hidden=false; });
const closeModal = ()=> modal.hidden = true;
document.getElementById('closeTicks').addEventListener('click', closeModal);
document.getElementById('doneTicks').addEventListener('click', closeModal);
modal.addEventListener('click', e=>{ if (e.target === modal) closeModal(); });
addEventListener('keydown', e=>{ if (e.key==='Escape' && !modal.hidden) closeModal(); });
document.getElementById('resetTicks').addEventListener('click', ()=>{
  symbols = DEFAULT_SYMS.slice(); saveSyms(); renderGrid(); renderTickerShell(); refreshQuotes();
});

/* ============================================================
   Language + chrome
   ============================================================ */
function applyLang(){
  const L = t();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('liveTxt').textContent = L.live;
  document.getElementById('floorBtn').textContent = L.floor;
  document.getElementById('qaSend').textContent = L.ask;
  document.getElementById('qaInput').placeholder = L.askPh;
  document.getElementById('newSession').textContent = L.newSession;
  document.getElementById('tickerLabel').textContent = L.ticker;
  document.getElementById('newsLabel').textContent = L.session;
  document.getElementById('editTxt').textContent = L.edit;
  document.getElementById('mTitle').textContent = L.tickTitle;
  document.getElementById('mHint').textContent = L.tickHint;
  document.getElementById('addSym').textContent = L.add;
  document.getElementById('resetTicks').textContent = L.reset;
  document.getElementById('doneTicks').textContent = L.done;
  paintVoiceBtn();
  document.getElementById('notAdvice').textContent = L.notAdvice;
  if (sessionState === 'qa' && session) buildDeck();
  drawScreen();
  try{ localStorage.setItem('aic-lang', lang); }catch(e){}
}
const langSel = document.getElementById('langSel');
langSel.value = lang;
langSel.addEventListener('change', e=>{
  lang = e.target.value;
  applyLang();
  stopVoice();
  runSession();          /* the committee re-convenes in the new language */
});
applyLang();

/* session strip + clock */
const newsTrack = document.getElementById('newsTrack');
function paintStrip(){
  const parts = [
    '<span><time>'+PROPOSAL.ticker+'</time>'+money(PROPOSAL.amount)+' proposed</span>',
    '<span><time>PORTFOLIO</time>'+money(PROPOSAL.portfolioValue)+'</span>',
    '<span><time>SECTOR</time>'+PROPOSAL.currentSectorExposure+'%</span>',
    '<span><time>RISK</time>'+PROPOSAL.riskTolerance+'</span>',
    '<span><time>HORIZON</time>'+PROPOSAL.horizonYears+'y</span>'
  ];
  if (session) parts.push('<span><time>DECISION</time>'+String(session.decision||'').replace('_',' ').toUpperCase()+
    ' · '+pct((session.confidence||0)*100)+'</span>');
  if (typeof newsItems !== 'undefined' && newsItems.length)
    newsItems.slice(0,4).forEach(n => parts.push('<span><time>'+(n.datetime||'').slice(5,10)+'</time>'+n.headline+'</span>'));
  newsTrack.innerHTML = parts.join('') + parts.join('');
}
paintStrip();
setInterval(()=>{
  secs++;
  document.getElementById('timer').textContent =
    String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString(LOCALES[lang]||'en-US',
      {hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'America/New_York'}) + ' ET';
  if (sessionState === 'qa') paintStrip();
}, 1000);

/* the landing page / parent frame can start a session with its own proposal */
addEventListener('message', e=>{
  const d = e.data;
  if (!d || d.type !== 'aic-proposal' || !d.proposal) return;
  Object.assign(PROPOSAL, d.proposal);
  paintStrip();
  runSession();
});

drawScreen();
runSession();
</script>
